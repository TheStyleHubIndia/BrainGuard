name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "App.js"
      - "app.json"
      - "package.json"
      - "babel.config.js"
      - "plugins/**"
      - "src/**"
      - ".github/workflows/android-build.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build BrainGuard APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo Android JavaScript bundle
        run: npx expo export --platform android --output-dir dist-check

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrainGuard-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
